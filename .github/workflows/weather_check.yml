- name: 通知時刻ログを自動コミットして保存
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f last_alert.json ]; then
            git add last_alert.json
            git commit -m "chore: update last alert log [skip ci]" || exit 0
            git push
          fi
